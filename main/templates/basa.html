{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FIGHT ACADEMY{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/basa.css' %}">
    {% block css %}
    {% endblock %}
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="{% static 'svg/logo.svg' %}" alt="logo">
            <div class="name_sport">
                <h1>FIGHT ACADEMY</h1>
            </div>
        </div>

        <div class="urls">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'trenery' %}">Тренеры</a>
            <a href="{% url 'schedule' %}">Расписание</a>
            <a href="{% url 'price' %}">Цены</a>
            <a href="{% url 'contact' %}">Контакты</a>
            <a href="{% url 'contact' %}">Записаться</a>
        </div>
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
